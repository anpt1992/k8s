apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-to-kube-scheduler
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      component: kube-scheduler
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 10259
  policyTypes:
  - Ingress
